<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Juice Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">🥤</span>
      <h1>OWASP Juice Shop</h1>
    </div>

    <!-- novalidate turns off the browser's built-in validation so our own
         JavaScript function is responsible for all client-side checks -->
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="username"
        placeholder="you@example.com"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        placeholder="At least 8 characters"
      />

      <button type="submit">Log in</button>

      <!-- Validation and server messages are written here by script.js -->
      <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
